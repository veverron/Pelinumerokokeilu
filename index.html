<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pelinumerokokeilu</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
    }

    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 5px;
    }

    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 10px;
      font-size: 1rem;
    }

    button {
      margin-top: 20px;
      cursor: pointer;
    }

    #viesti {
      min-height: 1.5em;
      margin-top: 15px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 25px;
    }

    th, td {
      text-align: left;
      padding: 8px;
      border-bottom: 1px solid #ccc;
    }
  </style>
</head>
<body>
  <h1>Pelinumerokokeilu</h1>

  <label for="nimi">Nimi</label>
  <input id="nimi" type="text" maxlength="100" autocomplete="off">

  <label for="pelinumero">Pelinumero</label>
  <input id="pelinumero" type="number" min="0" max="9999">

  <button id="tallenna">Tallenna</button>

  <div id="viesti"></div>

  <h2>Tallennetut</h2>
  <table>
    <thead>
      <tr>
        <th>Nimi</th>
        <th>Pelinumero</th>
      </tr>
    </thead>
    <tbody id="lista"></tbody>
  </table>

  <script>
    const nimiInput = document.querySelector('#nimi');
    const numeroInput = document.querySelector('#pelinumero');
    const tallennaButton = document.querySelector('#tallenna');
    const viesti = document.querySelector('#viesti');
    const lista = document.querySelector('#lista');

    async function lataaPelaajat() {
      const response = await fetch('/api/pelaajat');
      const pelaajat = await response.json();

      lista.innerHTML = '';

      for (const pelaaja of pelaajat) {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${escapeHtml(pelaaja.nimi)}</td>
          <td>${pelaaja.pelinumero}</td>
        `;
        lista.appendChild(row);
      }
    }

    async function tallennaPelaaja() {
      const nimi = nimiInput.value.trim();
      const pelinumero = Number(numeroInput.value);

      if (!nimi || !Number.isInteger(pelinumero)) {
        viesti.textContent = 'Anna nimi ja pelinumero.';
        return;
      }

      const response = await fetch('/api/pelaajat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nimi, pelinumero })
      });

      if (!response.ok) {
        viesti.textContent = 'Tallennus epäonnistui.';
        return;
      }

      nimiInput.value = '';
      numeroInput.value = '';
      viesti.textContent = 'Tallennettu.';
      await lataaPelaajat();
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    tallennaButton.addEventListener('click', tallennaPelaaja);
    lataaPelaajat();
  </script>
</body>
</html>
